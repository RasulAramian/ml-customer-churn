name: CI/CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:

  # =========================
  # 1. Test
  # =========================
  test:
    runs-on: self-hosted

    env:
      PYTHONPATH: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v


  # =========================
  # 2. Build & Push to GHCR
  # =========================
  publish:
    needs: test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ghcr.io/rasularamian/ml-customer-churn:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push \
            ghcr.io/rasularamian/ml-customer-churn:${{ github.sha }}

  # =========================
  # 3. Deploy
  # =========================
  deploy:
    needs: publish

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: self-hosted

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Docker image
        run: |
          docker pull \
            ghcr.io/rasularamian/ml-customer-churn:${{ github.sha }}

      - name: Stop old container
        run: |
          docker stop customer-churn-production || true

      - name: Remove old container
        run: |
          docker rm customer-churn-production || true

      - name: Run new container
        run: |
          docker run -d \
            --name customer-churn-production \
            -p 8000:8000 \
            ghcr.io/rasularamian/ml-customer-churn:${{ github.sha }}
